# CI for the documentation: `pnpm build` (astro check, then astro build) on every push and pull request.
# Required status check: `build`. GitHub Pages deploys from GitHub Actions (.github/workflows/pages.yml).
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:26.13
    resource_class: medium
    working_directory: ~/documentation
    environment:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    executor: node
    steps:
      - checkout
      - run:
          name: Enable pnpm through Corepack
          command: |
            # Node 26 no longer ships Corepack; package.json's "packageManager" picks the pnpm version.
            sudo npm install --global corepack
            sudo corepack enable
            corepack install
            pnpm --version
            pnpm config set store-dir "$HOME/.pnpm-store"
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Check and build the site
          command: pnpm build
      - store_artifacts:
          path: dist
          destination: site

workflows:
  build:
    jobs:
      - build
