# CI for the documentation: `pnpm build` (astro check, then astro build) on every push and pull request.
# Required status check: `build`. GitHub Pages deploys from GitHub Actions (.github/workflows/pages.yml).
version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  node:
    docker:
      - image: cimg/node:26.13
    resource_class: medium
    working_directory: ~/documentation
    environment:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    executor: node
    steps:
      - checkout
      # Node from .nvmrc and pnpm 12.16.1 (package.json's "packageManager") through the node orb, then
      # `pnpm install --frozen-lockfile` with the orb's node_modules cache.
      - node/install:
          install-pnpm: true
          pnpm-version: '12.16.1'
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Check and build the site
          command: pnpm build
      - store_artifacts:
          path: dist
          destination: site

workflows:
  build:
    jobs:
      - build
