allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.9'
  - '@astrojs/mdx@8.1.5'
  - '@astrojs/react-renderer@0.1.2'
  - '@astrojs/react@7.1.8'
  - '@astrojs/runtime@0.1.1'
  - '@astrojs/starlight@0.42.11'
  - '@astrojs/vite-plugin-astro@0.1.2'
  - astro@7.4.11

# Starlight pins satteri 0.10.5, whose native binary pnpm doesn't link; everything else uses 0.11.
# One version, so the build finds its binding.
overrides:
  satteri: 0.11.7
